<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1a365d;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        nav {
            background-color: #2b6cb0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 1rem 1.5rem;
            display: block;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background-color: #2c5282;
        }

        .contenido {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #f7fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        section h2 {
            margin-bottom: 0.8rem;
            color: #2b6cb0;
        }

        footer {
            background-color: #1a202c;
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            nav ul {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Amazon</h1>
        <img src="logo.jpg" alt="logo de amazon">
        <p>Ya tienes cuenta?, inicia sesion!</p>
    </header>

    <nav>
        <ul>
            <li><a href="amazon.html">Inicio</a></li>
            <li><a href="registro.html">Registrate</a></li>
            <li><a href="inicia sesion.html">Inicia sesion</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <div class="contenido">

        <section>
            <h2>Inicia Sesion</h2>
            <form action="" method="post">
                Ingresa tu nombre:
                <br>
                <input type="text" name="nombre">
                <br>
                Ingresa tu contraseña:
                <br>
                <input type="password" name="pass">
                <br>
                <input type="submit" value="enviar">
                <input type="reset" value="borrar"> 
            </form>
        </section>
    </div>

    <footer>
       <p>Oscar Jahir Perez Munoz | 5°I | Programacion | 24308051280611</p>
    </footer>

</body>
</html>
