<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffenio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #E7C196;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        nav {
            background-color: #6D3C1C;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 1rem 1.5rem;
            display: block;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background-color: #2c5282;
        }

        .contenido {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        section {
            padding: 1.5rem;
            background-color: #f7fafc;
            border-radius: 8px;
            border: 1px solid #E7C196;
            text-align: center;
        }

        section h2 {
            margin-bottom: 0.8rem;
            color: #E7C196;
            font-size: 1.1rem;
        }

        section img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        footer {
            background-color: #6D3C1C;
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .contenido {
                grid-template-columns: repeat(2, 1fr); 
            }
            nav ul {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .contenido {
                grid-template-columns: 1fr; 
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Caffenio</h1>
        <img src="caffenio.jpg" alt="logo de caffenio">
        <p>Bienvenido a nuestra página web</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="registro.html">Registrate</a></li>
            <li><a href="menu.html">Menu</a></li>
        </ul>
    </nav>

    <div class="contenido">
        <section>
            <h2>Americano Expresso</h2>
            <img src="expresso.jpg" alt="Americano expresso">
        </section>

        <section>
            <h2>Americano Regular</h2>
            <img src="regular.jpg" alt="americano regular">
        </section>

        <section>
            <h2>Tisana Fresa Kiwi</h2>
            <img src="kiwi.jpg" alt="Tisana fresa kiwi">
        </section>

        <section>
            <h2>Tonic Uva</h2>
            <img src="tonic.jpg" alt="tonic uva">
        </section>
         <section>
            <h2>Capuchino Regular</h2>
            <img src="capuchino.jpg" alt="capuchino regular">
        </section>
         <section>
            <h2>Matcha Caliente</h2>
            <img src="matcha.jpg" alt="matcha caliente">
        </section>
    </div>

    <footer>
       <p>Oscar Jahir Perez Munoz | 5°I | Programacion | 24308051280611</p>
    </footer>

</body>
</html>
