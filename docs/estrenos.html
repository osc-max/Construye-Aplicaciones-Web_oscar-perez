<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinépolis - Próximos Estrenos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f4; text-align: center; }
        
        .navbar { background: #0b2341; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #ffcc00; font-size: 22px; font-weight: bold; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .btn-club { background: #ffcc00; color: #0b2341 !important; padding: 5px 10px; border-radius: 4px; }

        header { background: #1a365d; color: white; padding: 20px; }

        .contenedor { padding: 20px; }
        h2 { color: #0b2341; margin-bottom: 15px; }
        .peliculas { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .card { background: white; padding: 10px; border-radius: 8px; width: 180px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .card img { width: 100%; border-radius: 5px; }
        .card h3 { font-size: 16px; margin: 10px 0; }
        .card button { background: #ffcc00; color: #0b2341; font-weight: bold; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; }

        footer { background: #0b2341; color: white; padding: 15px; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Cinépolis</a>
        <div class="nav-links">
            <a href="index.html">Cartelera</a>
            <a href="estrenos.html">Próximos Estrenos</a>
            <a href="Registro.html" class="btn-club">Club Cinépolis</a>
        </div>
    </nav>

    <header>
        <h1>Próximos Estrenos</h1>
        <p>Muy pronto en tu cine favorito</p>
    </header>

    <div class="contenedor">
        <h2>Muy Pronto</h2>
        <div class="peliculas">
            <div class="card">
                <img src="avenger.jpg" alt="Estreno 1">
                <h3>Avengers:Doomsday Infinity Vision</h3>
                <button>Ver Tráiler</button>
            </div>
            <div class="card">
                <img src="spiderman.jpeg" alt="Estreno 2">
                <h3>Spider-Man: Sin Camino a Casa</h3>
                <button>Ver Tráiler</button>
            </div>
            <div class="card">
                <img src="godzilla.jpg" alt="Estreno 3">
                <h3>Godzilla Minus Zero</h3>
                <button>Ver Tráiler</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Oscar Jahir Perez Munoz | 5°I | Programacion | 24308051280611</p>
    </footer>

</body>
</html>
